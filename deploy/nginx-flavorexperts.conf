# Nginx config for VPS — copy to: /etc/nginx/sites-available/flavorexperts
# then: sudo ln -s /etc/nginx/sites-available/flavorexperts /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name flavorexpertsnetwork.com www.flavorexpertsnetwork.com;

    # Redirect to HTTPS (after certbot)
    return 301 https://flavorexpertsnetwork.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flavorexpertsnetwork.com www.flavorexpertsnetwork.com;

    root /var/www/flavorexperts/dist;
    index index.html;

    # SSL certificates (certbot will fill these paths)
    ssl_certificate     /etc/letsencrypt/live/flavorexpertsnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flavorexpertsnetwork.com/privkey.pem;

    # Canonical: redirect www → apex
    if ($host = www.flavorexpertsnetwork.com) {
        return 301 https://flavorexpertsnetwork.com$request_uri;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
