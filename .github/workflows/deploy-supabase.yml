name: Deploy Supabase (manual)

# Never runs on pull_request. Never pushes migrations during ordinary CI.
# Production database and Edge Functions deploy only from a manual dispatch
# after GitHub Environment approval.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending local migrations with supabase db push
        type: boolean
        default: false
      deploy_functions:
        description: Deploy send-email, auth-email-hook, and submit-public-form
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "access_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "access_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Supabase deploy — SUPABASE_ACCESS_TOKEN is not configured on this repository."
          fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "db_password=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_password=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.access_token == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.access_token == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.creds.outputs.access_token == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +x
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref imucfofvdwfyexdwrsfe --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref imucfofvdwfyexdwrsfe
          fi

      - name: Apply pending migrations
        if: steps.creds.outputs.access_token == 'true' && inputs.apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "${{ steps.creds.outputs.db_password }}" != "true" ]; then
            echo "::error::apply_migrations requires SUPABASE_DB_PASSWORD. Refusing Management API fallback so Production is not mutated unexpectedly."
            exit 1
          fi
          supabase db push --yes

      - name: Deploy email edge functions
        if: steps.creds.outputs.access_token == 'true' && inputs.deploy_functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-email --project-ref imucfofvdwfyexdwrsfe --no-verify-jwt
          supabase functions deploy auth-email-hook --project-ref imucfofvdwfyexdwrsfe --no-verify-jwt
          supabase functions deploy submit-public-form --project-ref imucfofvdwfyexdwrsfe --no-verify-jwt

      - name: Skip notice
        if: steps.creds.outputs.access_token != 'true'
        run: echo "Supabase manual deploy skipped because repository secrets are missing."
