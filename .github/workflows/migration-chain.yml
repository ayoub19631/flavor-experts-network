name: Migration chain

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/approved-migration-history.json"
      - "supabase/tests/fresh_db/**"
      - "scripts/check-migration-chain.mjs"
      - "scripts/apply-fresh-migrations.py"
      - ".github/workflows/migration-chain.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/approved-migration-history.json"
      - "supabase/tests/fresh_db/**"
      - "scripts/check-migration-chain.mjs"
      - "scripts/apply-fresh-migrations.py"
      - ".github/workflows/migration-chain.yml"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check timestamps, dependencies, and applied-file hashes
        run: node scripts/check-migration-chain.mjs

  fresh-db:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply full chain on empty Postgres
        run: python scripts/apply-fresh-migrations.py
