name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: app/frontend
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://flavorexpertsnetwork.com
          VITE_OAUTH_ENABLED: "true"
          VITE_PAYMENTS_ENABLED: "false"

      - name: Sync web assets into Android project
        working-directory: app/frontend
        run: pnpm exec cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: app/frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavor-experts-debug-apk
          path: app/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build signed release APK (when keystore secrets exist)
        if: ${{ vars.ANDROID_KEYSTORE_CONFIGURED == 'true' }}
        working-directory: app/frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ vars.ANDROID_KEYSTORE_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flavor-experts-release-apk
          path: app/frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 90
