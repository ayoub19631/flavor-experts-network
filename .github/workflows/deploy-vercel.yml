name: Deploy Vercel Production

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Vercel deploy — add repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://flavorexpertsnetwork.com
        run: |
          set -e
          pnpm typecheck || { echo "::error::Typecheck failed"; exit 1; }
          pnpm lint || { echo "::error::Lint failed"; exit 1; }
          pnpm test || { echo "::error::Unit tests failed"; exit 1; }
          pnpm build || { echo "::error::Production build failed"; exit 1; }

      - name: Deploy production via Vercel CLI
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://flavorexpertsnetwork.com
          VITE_APP_TITLE: Flavor Experts Network
          VITE_APP_DESCRIPTION: Professional community for flavor scientists and food technologists
          VITE_PLATFORM_PRIVATE: "false"
          VITE_OAUTH_ENABLED: "true"
          VITE_PAYMENTS_ENABLED: "false"
        run: |
          set +x
          # Production deploys only from main (workflow trigger). Never echo tokens.
          pnpm dlx vercel@39 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@39 build --prod --token="$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@39 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
