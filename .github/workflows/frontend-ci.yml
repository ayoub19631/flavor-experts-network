name: Frontend CI

on:
  push:
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "vercel.json"
      - "package.json"
  pull_request:
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "vercel.json"
      - "package.json"

defaults:
  run:
    working-directory: app/frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
          VITE_SITE_URL: https://flavorexpertsnetwork.com
          VITE_PLATFORM_PRIVATE: "true"
          VITE_PLATFORM_ACCESS_ALLOWLIST: ci@example.com
          VITE_ADMIN_EMAIL: ci@example.com
          VITE_APP_DESCRIPTION: Flavor Experts Network is currently under development.

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
          VITE_SITE_URL: http://127.0.0.1:3001
          VITE_PORT: "3001"
          VITE_PLATFORM_PRIVATE: "true"
          VITE_PLATFORM_ACCESS_ALLOWLIST: ci@example.com
          VITE_ADMIN_EMAIL: ci@example.com
          VITE_APP_TITLE: Flavor Experts Network
          VITE_APP_DESCRIPTION: Under development
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
