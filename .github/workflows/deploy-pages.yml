name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npx vite build --base=/flavor-experts-network/ --outDir gh-dist
      - run: cp gh-dist/index.html gh-dist/404.html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/frontend/gh-dist
          force_orphan: true
