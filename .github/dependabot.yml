version: 2
updates:
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    groups:
      frontend-patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
