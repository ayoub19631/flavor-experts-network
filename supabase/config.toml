# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "flavorexperts"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://127.0.0.1:3001/auth/callback", "https://flavorexpertsnetwork.com/auth/callback"]

[functions.oauth]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.flavorbot]
verify_jwt = true

[functions.send-email]
verify_jwt = false

[functions.submit-public-form]
verify_jwt = false

[functions.auth-email-hook]
verify_jwt = false
