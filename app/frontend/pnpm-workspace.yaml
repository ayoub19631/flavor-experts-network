# Single-package workspace so pnpm 9 (CI) and pnpm 10/11 (Vercel/local) both work.
# Without `packages`, pnpm 9 fails with: "packages field missing or empty".
packages:
  - '.'

# pnpm 10.15+ / 11 — allow native builds during install (ignored by pnpm 9).
allowBuilds:
  '@metagptx/vite-plugin-source-locator': true
  '@swc/core': true
  esbuild: true
  sharp: true
  simple-git-hooks: true

onlyBuiltDependencies:
  - '@metagptx/vite-plugin-source-locator'
  - '@swc/core'
  - esbuild
  - sharp
  - simple-git-hooks

overrides:
  "tar@^7.0.0": 7.5.22
  "ws@^8.0.0": 8.21.3
  "postcss@^8.0.0": 8.5.18
  "nanoid@^3.0.0": 3.3.18
  "js-yaml@^4.0.0": 4.3.2
  "browserslist@^4.0.0": 4.28.7
  "brace-expansion@^1.0.0": 1.1.18
  "brace-expansion@^5.0.0": 5.0.9
  "minimatch@3.0.5": 3.1.4
  "@trapezedev/project": 7.1.10
